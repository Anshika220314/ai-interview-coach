services:
  # ==========================================
  # 1. Python FastAPI AI Engine (Dockerized for FAISS & PyTorch)
  # ==========================================
  - type: web
    name: ai-interview-coach-ai
    runtime: docker
    rootDir: backend/ai-service
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # ==========================================
  # 2. Spring Boot Core Backend
  # ==========================================
  - type: web
    name: ai-interview-coach-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-coach-db
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: ai-interview-coach-ai
          property: host

  # ==========================================
  # 3. React Frontend (Vite Single Page App)
  # ==========================================
  - type: web
    name: ai-interview-coach-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_AI_URL
        sync: false

databases:
  # ==========================================
  # PostgreSQL Database Instance
  # ==========================================
  - name: ai-interview-coach-db
    databaseName: interview_coach
    user: anshika
    plan: free
