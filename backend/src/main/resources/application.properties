spring.application.name=backend

# Dynamic Port Binding (Render passes PORT, default 8080)
server.port=${PORT:8080}

# Datasource Configuration (Defaults to local PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interview_coach}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:anshika}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Internal Microservice Cross-Communication
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

# File Upload Configuration
file.upload-dir=${UPLOAD_DIR:uploads}